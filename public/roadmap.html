<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progressive Learning — Course Roadmap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Winding trail animation */
    @keyframes flowTrail {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -32; }
    }
    .trail-flow-active {
      animation: flowTrail 1.4s linear infinite;
    }
    .trail-flow-completed {
      animation: flowTrail 2.5s linear infinite;
    }

    /* Expanding halo ripple for current active node */
    @keyframes haloRipple {
      0% {
        transform: scale(0.9);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.35);
        opacity: 0.2;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }
    .halo-ripple {
      animation: haloRipple 2.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }
    .halo-ripple-delay {
      animation: haloRipple 2.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      animation-delay: 0.9s;
    }

    /* Gentle floating bob on current node */
    @keyframes nodeBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .animate-bob {
      animation: nodeBob 2.8s ease-in-out infinite;
    }

    /* Milestone Trophy celebration glow */
    @keyframes trophyGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.35)); }
      50% { filter: drop-shadow(0 0 24px rgba(250, 204, 21, 0.7)); }
    }
    .trophy-glow {
      animation: trophyGlow 2.4s ease-in-out infinite;
    }

    /* Smooth entrance stagger */
    @keyframes nodeEnter {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .node-stagger {
      animation: nodeEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
  </style>
</head>
<body class="bg-app-canvas min-h-screen text-slate-800 dark:text-slate-100 antialiased selection:bg-rose-100 selection:text-rose-900 relative">

  <!-- Ambient decorative geometric accents -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-12 -left-12 w-64 h-64 rounded-full border border-dashed border-amber-300/40 opacity-70"></div>
    <div class="absolute top-36 right-8 flex flex-col gap-2.5 opacity-50 -rotate-45">
      <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
      <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
      <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
    </div>
    <div class="absolute bottom-16 -left-8 w-60 h-60 rounded-full border border-dashed border-amber-300/40 opacity-50"></div>
    <div class="absolute top-1/2 -right-16 w-80 h-80 rounded-full border border-dashed border-rose-300/30 opacity-40"></div>
  </div>

  <div id="navbar" class="relative z-40"></div>

  <main class="relative z-10 max-w-4xl mx-auto px-4 sm:px-6 py-10">
    
    <!-- Header: Navigation & Course Progress -->
    <div class="text-center mb-8">
      <a href="dashboard.html" class="inline-flex items-center gap-1.5 mb-4 px-4 py-1.5 rounded-full bg-white/90 dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white shadow-xs transition-all cursor-pointer">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5 text-rose-500"></i>
        <span>Back to Dashboard</span>
      </a>

      <h1 id="course-title" class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white mb-3 tracking-tight">Loading Course...</h1>
      
      <!-- Progress Bar Pill -->
      <div class="inline-flex items-center gap-3 px-5 py-2.5 bg-white/95 dark:bg-slate-800/95 border border-slate-200/90 dark:border-slate-700 rounded-full shadow-xs mb-8">
        <div class="w-32 sm:w-44 bg-slate-100 dark:bg-slate-700 rounded-full h-2.5 overflow-hidden p-0.5">
          <div id="progress-bar" class="bg-gradient-to-r from-amber-400 via-rose-500 to-indigo-600 h-full rounded-full transition-all duration-700 shadow-sm" style="width: 0%"></div>
        </div>
        <span id="progress-text" class="text-xs font-extrabold text-slate-700 dark:text-slate-200">0 of 0 Lessons Completed</span>
      </div>

      <!-- STATUS LEGEND (Exact match to requested visual design) -->
      <div class="flex items-center justify-center gap-6 sm:gap-10 py-3 px-6 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-full border border-slate-200/80 dark:border-slate-700 shadow-xs w-fit mx-auto">
        <!-- Completed legend item -->
        <div class="flex items-center gap-2 text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300">
          <div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-xs">
            <i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>
          </div>
          <span>Completed</span>
        </div>
        <!-- Current legend item -->
        <div class="flex items-center gap-2 text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300">
          <div class="w-5 h-5 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 text-white flex items-center justify-center shadow-xs">
            <svg class="w-2.5 h-2.5 ml-0.5 fill-current" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20"></polygon></svg>
          </div>
          <span class="text-indigo-600 dark:text-indigo-400">Current</span>
        </div>
        <!-- Locked legend item -->
        <div class="flex items-center gap-2 text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400">
          <div class="w-5 h-5 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-400 dark:text-slate-400 flex items-center justify-center">
            <i data-lucide="lock" class="w-3 h-3"></i>
          </div>
          <span>Locked</span>
        </div>
      </div>
    </div>

    <!-- WINDING SERPENTINE ROADMAP CANVAS -->
    <div id="roadmap-wrapper" class="relative max-w-2xl mx-auto py-8 px-2 sm:px-6">
      <!-- Dynamic SVG winding S-curve connector layer -->
      <svg id="roadmap-svg" class="absolute inset-0 w-full h-full pointer-events-none z-0 overflow-visible"></svg>

      <!-- Roadmap nodes container -->
      <div id="roadmap-container" class="relative z-10 space-y-20 sm:space-y-24">
        <div class="text-center py-20"><div class="spinner mx-auto mb-4"></div><p class="text-xs text-slate-400">Generating learning trail...</p></div>
      </div>
    </div>

  </main>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let globalCourseId = null;
    let globalLessons = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      globalCourseId = urlParams.get('course_id');
      if (!globalCourseId) {
        window.location.href = 'courses.html';
        return;
      }

      try {
        const data = await apiFetch(`/lessons/course/${globalCourseId}`);
        const { course, lessons } = data;
        globalLessons = lessons || [];
        
        document.getElementById('course-title').textContent = course.title || 'Course Roadmap';
        
        const completedCount = globalLessons.filter(l => l.status === 'completed').length;
        const total = globalLessons.length;
        document.getElementById('progress-text').textContent = `${completedCount} of ${total} Lessons Completed`;
        document.getElementById('progress-bar').style.width = total > 0 ? `${(completedCount/total)*100}%` : '0%';

        // Tag the first unlocked non-completed lesson as 'current'
        let currentAssigned = false;
        globalLessons.forEach(l => {
          if (l.status === 'unlocked' && !currentAssigned) {
            l.status = 'current';
            currentAssigned = true;
          }
        });

        renderWindingRoadmap(globalLessons, completedCount === total && total > 0);

      } catch (err) {
        document.getElementById('roadmap-container').innerHTML = `
          <div class="text-center text-rose-500 p-8 font-medium app-card rounded-3xl">
            Failed to load roadmap: ${escapeHtml(err.message)}
          </div>
        `;
      }
    });

    function renderWindingRoadmap(lessons, allCompleted) {
      const container = document.getElementById('roadmap-container');
      let html = '';

      lessons.forEach((lesson, index) => {
        // Alternating zigzag sides:
        // Even index (0, 2, 4...) -> Node on Left (~28%), Card on Right
        // Odd index (1, 3, 5...)  -> Node on Right (~72%), Card on Left
        const isLeft = index % 2 === 0;
        const isCurrent = lesson.status === 'current';
        const isCompleted = lesson.status === 'completed';
        const isLocked = !isCurrent && !isCompleted;

        // Subtitle status text
        let statusTag = '';
        if (isCompleted) {
          statusTag = '<span class="text-emerald-600 dark:text-emerald-400 font-bold ml-1.5">• Completed</span>';
        } else if (isCurrent) {
          statusTag = '<span class="text-indigo-600 dark:text-indigo-400 font-bold ml-1.5">• Start here</span>';
        } else {
          statusTag = '<span class="text-slate-400 font-medium ml-1.5">• Locked</span>';
        }

        // Circular Node Graphic
        let circleHtml = '';
        if (isCurrent) {
          circleHtml = `
            <div class="relative flex items-center justify-center animate-bob">
              <!-- Animated halo ripples -->
              <div class="absolute w-20 h-20 rounded-full bg-indigo-500/25 halo-ripple pointer-events-none"></div>
              <div class="absolute w-20 h-20 rounded-full bg-indigo-500/20 halo-ripple-delay pointer-events-none"></div>
              
              <!-- Outer halo ring -->
              <div class="node-circle-anchor w-16 h-16 sm:w-18 sm:h-18 rounded-full bg-indigo-100/90 dark:bg-indigo-950/60 border-2 border-indigo-400 dark:border-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 transition-transform group-hover:scale-110" data-status="current" data-index="${index}">
                <!-- Inner solid purple circle with play icon -->
                <div class="w-12 h-12 sm:w-13 sm:h-13 rounded-full bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/40">
                  <svg class="w-5 h-5 ml-0.5 fill-current" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20"></polygon></svg>
                </div>
              </div>
            </div>
          `;
        } else if (isCompleted) {
          circleHtml = `
            <div class="relative flex items-center justify-center">
              <!-- Outer soft green halo ring -->
              <div class="node-circle-anchor w-15 h-15 sm:w-16 sm:h-16 rounded-full bg-emerald-50 dark:bg-emerald-950/40 border-2 border-emerald-200 dark:border-emerald-700/60 flex items-center justify-center shadow-xs transition-transform group-hover:scale-110" data-status="completed" data-index="${index}">
                <!-- Inner solid green circle with checkmark -->
                <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-emerald-500 flex items-center justify-center text-white shadow-md shadow-emerald-500/25">
                  <i data-lucide="check" class="w-6 h-6 stroke-[3] text-white"></i>
                </div>
              </div>
            </div>
          `;
        } else {
          // Locked
          circleHtml = `
            <div class="relative flex items-center justify-center">
              <!-- Outer soft gray halo ring -->
              <div class="node-circle-anchor w-15 h-15 sm:w-16 sm:h-16 rounded-full bg-slate-100/80 dark:bg-slate-800/80 border-2 border-slate-200 dark:border-slate-700 flex items-center justify-center transition-transform group-hover:scale-105" data-status="locked" data-index="${index}">
                <!-- Inner soft circle with lock icon -->
                <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-slate-200/90 dark:bg-slate-700/80 flex items-center justify-center text-slate-400">
                  <i data-lucide="lock" class="w-5 h-5"></i>
                </div>
              </div>
            </div>
          `;
        }

        // Label Info Block
        const titleClass = isLocked 
          ? 'text-slate-600 dark:text-slate-400' 
          : 'text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors';

        const labelHtml = `
          <div class="flex flex-col ${isLeft ? 'text-left' : 'text-right sm:text-right'} max-w-[220px] sm:max-w-xs">
            <h3 class="font-extrabold text-sm sm:text-base leading-snug tracking-tight ${titleClass}">
              ${escapeHtml(lesson.title)}
            </h3>
            <p class="text-xs text-slate-400 mt-1 flex items-center gap-1 ${isLeft ? 'justify-start' : 'justify-end'}">
              <span>${escapeHtml(lesson.duration || '15 min')}</span>
              ${statusTag}
            </p>
          </div>
        `;

        // Click wrapper / Link
        const clickAttr = isLocked 
          ? `onclick="showLockedToast()"` 
          : `href="lesson.html?id=${lesson.id}"`;

        const cursorClass = isLocked ? 'cursor-not-allowed opacity-80' : 'cursor-pointer';

        // Layout per row
        // On Left: [Circle]  ----->  [Label]
        // On Right: [Label]  <-----  [Circle]
        html += `
          <div class="node-stagger relative flex items-center w-full ${isLeft ? 'justify-start pl-4 sm:pl-16' : 'justify-end pr-4 sm:pr-16'}" style="animation-delay: ${index * 0.08}s">
            <${isLocked ? 'div' : 'a'} ${clickAttr} class="group flex items-center gap-4 sm:gap-6 ${isLeft ? 'flex-row' : 'flex-row-reverse'} ${cursorClass} select-none">
              ${circleHtml}
              ${labelHtml}
            </${isLocked ? 'div' : 'a'}>
          </div>
        `;
      });

      // ============================================================
      // FINAL EXAM MILESTONE AT TRAIL END
      // ============================================================
      if (allCompleted) {
        html += `
          <div class="node-stagger relative flex flex-col items-center justify-center pt-8 pb-4" style="animation-delay: ${(lessons.length + 1) * 0.08}s">
            <a href="course-quiz.html?course_id=${globalCourseId}" class="group flex flex-col items-center text-center cursor-pointer">
              <!-- Golden Final Milestone Badge -->
              <div class="node-circle-anchor w-20 h-20 sm:w-22 sm:h-22 rounded-3xl bg-[#1c1e24] border-2 border-amber-400 text-amber-400 flex items-center justify-center shadow-xl shadow-amber-500/25 trophy-glow transition-transform group-hover:scale-110" data-status="completed" data-index="${lessons.length}">
                <i data-lucide="graduation-cap" class="w-10 h-10 stroke-[2.5]"></i>
              </div>
              <div class="mt-4 max-w-sm">
                <span class="inline-block px-3 py-1 rounded-full text-xs font-extrabold bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300 mb-1 border border-amber-300/60">
                  🎉 Final Milestone Ready
                </span>
                <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white">Course Final Examination</h3>
                <p class="text-xs text-slate-400 mt-1 mb-3">Pass the final exam to graduate, earn certificate XP & complete course</p>
                <span class="btn-red-cta inline-flex items-center gap-2 px-6 py-2.5 rounded-full text-xs font-bold shadow-md">
                  Take Final Exam <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                </span>
              </div>
            </a>
          </div>
        `;
      } else {
        html += `
          <div class="node-stagger relative flex flex-col items-center justify-center pt-8 pb-4 opacity-70" style="animation-delay: ${(lessons.length + 1) * 0.08}s">
            <div class="flex flex-col items-center text-center cursor-not-allowed" onclick="showLockedToast('Complete all preceding lessons to unlock the course final exam.')">
              <!-- Muted Locked Final Milestone Badge -->
              <div class="node-circle-anchor w-18 h-18 sm:w-20 sm:h-20 rounded-3xl bg-slate-100 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 text-slate-400 flex items-center justify-center shadow-xs" data-status="locked" data-index="${lessons.length}">
                <i data-lucide="lock" class="w-8 h-8"></i>
              </div>
              <div class="mt-3 max-w-xs">
                <h3 class="text-sm sm:text-base font-bold text-slate-600 dark:text-slate-300">Course Final Examination</h3>
                <p class="text-xs text-slate-400 mt-0.5">Complete all lessons above to unlock</p>
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
      if (window.lucide) lucide.createIcons();

      // Recalculate and draw the S-curve SVG paths
      requestAnimationFrame(() => {
        drawRoadmapCurves();
      });
      setTimeout(drawRoadmapCurves, 80);
      setTimeout(drawRoadmapCurves, 300);
    }

    // ============================================================
    // DYNAMIC SVG S-CURVE GENERATOR
    // ============================================================
    function drawRoadmapCurves() {
      const wrapper = document.getElementById('roadmap-wrapper');
      const svg = document.getElementById('roadmap-svg');
      if (!wrapper || !svg) return;

      const wrapperRect = wrapper.getBoundingClientRect();
      const w = wrapperRect.width;
      const h = wrapperRect.height;

      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

      // Query all milestone circle centers
      const circles = wrapper.querySelectorAll('.node-circle-anchor');
      if (circles.length < 2) return;

      let pathsHtml = `
        <defs>
          <linearGradient id="activeTrailGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="50%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#8b5cf6" />
          </linearGradient>
        </defs>
      `;

      for (let i = 0; i < circles.length - 1; i++) {
        const c1 = circles[i];
        const c2 = circles[i + 1];

        const r1 = c1.getBoundingClientRect();
        const r2 = c2.getBoundingClientRect();

        const x1 = (r1.left + r1.right) / 2 - wrapperRect.left;
        const y1 = (r1.top + r1.bottom) / 2 - wrapperRect.top;
        const x2 = (r2.left + r2.right) / 2 - wrapperRect.left;
        const y2 = (r2.top + r2.bottom) / 2 - wrapperRect.top;

        const dy = y2 - y1;
        // Perfect S-curve tangents
        const cpY1 = y1 + dy * 0.52;
        const cpY2 = y2 - dy * 0.52;

        const d = `M ${x1} ${y1} C ${x1} ${cpY1}, ${x2} ${cpY2}, ${x2} ${y2}`;

        const s1 = c1.dataset.status;
        const s2 = c2.dataset.status;

        const isCompletedSegment = s1 === 'completed' && s2 === 'completed';
        const isLeadingToCurrent = s1 === 'completed' && s2 === 'current';

        if (isCompletedSegment) {
          // Both nodes completed: radiant emerald line
          pathsHtml += `
            <path d="${d}" fill="none" stroke="#10b981" stroke-width="6" opacity="0.12" stroke-linecap="round"/>
            <path d="${d}" fill="none" stroke="#10b981" stroke-width="3.5" stroke-dasharray="8 8" class="trail-flow-completed" stroke-linecap="round"/>
          `;
        } else if (isLeadingToCurrent) {
          // Flowing energized trail into current node
          pathsHtml += `
            <path d="${d}" fill="none" stroke="#6366f1" stroke-width="7" opacity="0.15" stroke-linecap="round"/>
            <path d="${d}" fill="none" stroke="url(#activeTrailGrad)" stroke-width="4" stroke-dasharray="8 8" class="trail-flow-active" stroke-linecap="round"/>
          `;
        } else {
          // Inactive / Locked trail (matches user screenshot's dashed line)
          pathsHtml += `
            <path d="${d}" fill="none" stroke="#cbd5e1" class="dark:stroke-slate-700" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>
          `;
        }
      }

      svg.innerHTML = pathsHtml;
    }

    window.addEventListener('resize', drawRoadmapCurves);

    function showLockedToast(msg) {
      showToast(msg || 'Pass the previous quiz to unlock this lesson!', 'warning');
    }
  </script>
</body>
</html>
