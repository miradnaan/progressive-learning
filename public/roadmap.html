<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progressive Learning - Course Roadmap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
    
    <div class="text-center mb-12">
      <a href="dashboard.html" class="inline-block mb-6 text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors">← Back to Dashboard</a>
      <h1 id="course-title" class="text-3xl font-bold text-slate-900 dark:text-white mb-3">Loading...</h1>
      <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full shadow-sm">
        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-1.5 w-24">
          <div id="progress-bar" class="bg-emerald-500 h-1.5 rounded-full" style="width: 0%"></div>
        </div>
        <span id="progress-text" class="text-sm font-bold text-slate-700 dark:text-slate-300">0 of 0 Lessons Completed</span>
      </div>
    </div>

    <div id="roadmap-container" class="relative py-4">
      <div class="text-center py-20"><div class="spinner mx-auto mb-4"></div></div>
    </div>

  </main>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const courseId = urlParams.get('course_id');
      if (!courseId) {
        window.location.href = 'courses.html';
        return;
      }

      try {
        const data = await apiFetch(`/lessons/course/${courseId}`);
        const { course, lessons } = data;
        
        document.getElementById('course-title').textContent = course.title || 'Course Roadmap';
        
        const completedCount = lessons.filter(l => l.status === 'completed').length;
        const total = lessons.length;
        document.getElementById('progress-text').textContent = `${completedCount} of ${total} Lessons Completed`;
        document.getElementById('progress-bar').style.width = total > 0 ? `${(completedCount/total)*100}%` : '0%';

        const container = document.getElementById('roadmap-container');
        let html = '';

        lessons.forEach((lesson, index) => {
          const isLast = index === lessons.length - 1;
          
          let nodeClass = '';
          let icon = '';
          let content = '';
          let link = `href="lesson.html?id=${lesson.id}"`;

          if (lesson.status === 'completed') {
            nodeClass = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20';
            icon = '<div class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-md shadow-emerald-500/30"><i data-lucide="check" class="w-4 h-4 text-white"></i></div>';
            content = `<a ${link} class="block px-4 py-2 mt-2 text-sm font-medium text-emerald-700 dark:text-emerald-400 hover:underline">Review Lesson →</a>`;
          } else if (lesson.status === 'unlocked' || lesson.status === 'current') {
            nodeClass = 'border-indigo-500 bg-white dark:bg-slate-800 pulse-current shadow-lg';
            icon = `<div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-md shadow-indigo-600/30">${index + 1}</div>`;
            content = `<a ${link} class="inline-block px-5 py-2 mt-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-xl transition-colors shadow-md shadow-indigo-500/30">Start Lesson →</a>`;
          } else {
            // Locked
            nodeClass = 'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 opacity-75';
            icon = '<div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center"><i data-lucide="lock" class="w-4 h-4"></i></div>';
            content = `<p class="mt-2 text-xs text-slate-500 dark:text-slate-400">Complete previous quiz to unlock</p>`;
            link = ''; // no link
          }

          html += `
            <div class="relative flex flex-col items-center group">
              <div class="w-full max-w-sm">
                <div class="relative p-5 rounded-2xl border-2 ${nodeClass} text-center transition-transform hover:-translate-y-1">
                  <div class="absolute -top-4 left-1/2 transform -translate-x-1/2">
                    ${icon}
                  </div>
                  <h3 class="mt-2 font-bold text-slate-900 dark:text-white">${escapeHtml(lesson.title)}</h3>
                  <p class="text-sm text-slate-500 mt-1">${escapeHtml(lesson.duration || '10 mins')}</p>
                  ${content}
                  ${link ? `<a ${link} class="absolute inset-0"></a>` : ''}
                </div>
              </div>
            </div>
          `;

          // Connector line
          if (!isLast) {
            const nextLesson = lessons[index + 1];
            const lineClass = (lesson.status === 'completed' && (nextLesson.status === 'completed' || nextLesson.status === 'unlocked' || nextLesson.status === 'current')) 
              ? 'bg-emerald-500' 
              : 'bg-slate-200 dark:bg-slate-700';
            
            html += `<div class="roadmap-connector ${lineClass}"></div>`;
          }
        });

        // Final Exam node
        const allCompleted = completedCount === total && total > 0;
        const examLineClass = allCompleted ? 'bg-emerald-500' : 'bg-slate-200 dark:bg-slate-700';
        
        html += `<div class="roadmap-connector ${examLineClass}"></div>`;
        
        if (allCompleted) {
          html += `
            <div class="text-center mt-2">
              <a href="course-quiz.html?course_id=${courseId}" class="inline-flex flex-col items-center p-6 bg-gradient-to-br from-indigo-600 to-violet-700 rounded-3xl shadow-xl shadow-indigo-600/30 transform transition-transform hover:scale-105">
                <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mb-3 border-2 border-white/30 text-white">
                  <i data-lucide="graduation-cap" class="w-8 h-8"></i>
                </div>
                <h3 class="text-white font-bold text-xl">Course Final Exam</h3>
                <p class="text-indigo-100 text-sm mt-1 mb-4">Prove your knowledge to complete the course</p>
                <span class="px-6 py-2 bg-white text-indigo-700 font-bold rounded-xl">Take Final Exam →</span>
              </a>
            </div>
          `;
        } else {
          html += `
            <div class="text-center mt-2">
              <div class="inline-flex flex-col items-center p-6 bg-slate-100 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 border-dashed rounded-3xl opacity-70">
                <div class="w-12 h-12 bg-slate-200 dark:bg-slate-700 rounded-full flex items-center justify-center mb-3 text-slate-400">
                  <i data-lucide="lock" class="w-5 h-5"></i>
                </div>
                <h3 class="text-slate-500 dark:text-slate-400 font-bold">Course Final Exam</h3>
                <p class="text-slate-400 dark:text-slate-500 text-sm mt-1">Complete all lessons to unlock</p>
              </div>
            </div>
          `;
        }

        container.innerHTML = html;
        if (window.lucide) lucide.createIcons();

      } catch (err) {
        document.getElementById('roadmap-container').innerHTML = `<div class="text-center text-rose-500 p-8">${escapeHtml(err.message)}</div>`;
      }
    });
  </script>
</body>
</html>
