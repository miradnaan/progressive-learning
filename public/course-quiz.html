<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progressive Learning - Course Exam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .confetti {
      position: fixed;
      width: 10px; height: 10px;
      background-color: #f2d74e;
      animation: confetti-fall 3s ease-in-out infinite;
      z-index: 100;
      top: -10px;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen flex flex-col">
  <div id="navbar"></div>

  <main class="flex-1 flex items-center justify-center p-4">
    <div id="quiz-container" class="w-full max-w-2xl bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border-2 border-indigo-200 dark:border-indigo-900/50 overflow-hidden transform transition-all">
      
      <div id="loading" class="p-12 text-center">
        <div class="spinner mx-auto mb-4 border-t-indigo-600"></div>
        <p class="text-slate-500 font-medium">Assembling Final Exam...</p>
      </div>

      <!-- Quiz Content -->
      <div id="quiz-content" class="hidden flex flex-col h-full">
        <div class="p-6 md:p-8 bg-gradient-to-r from-indigo-600 to-violet-700 text-white">
          <h1 id="quiz-title" class="text-2xl md:text-3xl font-bold mb-2 flex items-center gap-2.5"><i data-lucide="graduation-cap" class="w-8 h-8"></i> Course Final Exam</h1>
          <p id="quiz-subtitle" class="text-indigo-100 text-sm font-medium opacity-90">Comprehensive exam covering all lessons. Earn 10 XP per correct question + 100 XP Course Completion Bonus (Need 70% to pass).</p>
          
          <div class="mt-6">
            <div class="flex justify-between text-xs font-bold text-indigo-200 mb-2">
              <span id="progress-text">Question 1 of 5</span>
            </div>
            <div class="w-full bg-white/20 rounded-full h-2">
              <div id="progress-bar" class="bg-white h-2 rounded-full transition-all duration-300 shadow-[0_0_10px_rgba(255,255,255,0.5)]" style="width: 20%"></div>
            </div>
          </div>
        </div>

        <div class="p-6 md:p-8 flex-1 bg-white dark:bg-slate-800">
          <h2 id="question-text" class="text-lg md:text-xl font-medium text-slate-800 dark:text-slate-200 mb-6">Question goes here?</h2>
          <div id="options-container" class="space-y-3"></div>
        </div>

        <div class="p-6 border-t border-slate-100 dark:border-slate-700 flex justify-end bg-slate-50/50 dark:bg-slate-900/50">
          <button id="btn-next" disabled class="px-6 py-2.5 bg-indigo-600 disabled:bg-slate-300 disabled:dark:bg-slate-700 text-white font-bold rounded-xl transition-colors shadow-md disabled:shadow-none">Next Question →</button>
        </div>
      </div>

      <!-- Result Screen -->
      <div id="result-screen" class="hidden p-8 md:p-12 text-center bg-white dark:bg-slate-800">
        <div id="result-icon" class="w-24 h-24 rounded-full flex items-center justify-center text-5xl mx-auto mb-6 shadow-lg"></div>
        <h2 id="result-title" class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-violet-600 mb-2">Result</h2>
        <p id="result-score" class="text-2xl font-bold text-slate-700 dark:text-slate-300 mb-4"></p>
        
        <div id="result-badge" class="mb-6 hidden">
          <span id="final-xp-badge" class="inline-flex items-center gap-2 px-5 py-2 bg-gradient-to-r from-amber-400 to-orange-500 text-white text-lg font-black rounded-full shadow-lg transform hover:scale-105 transition-transform cursor-default">
            <i data-lucide="zap" class="w-5 h-5 text-white"></i> <span id="final-xp-text">+0 XP Earned!</span>
          </span>
        </div>
        
        <p id="result-msg" class="text-lg font-medium text-slate-600 dark:text-slate-400 mb-8"></p>

        <div id="result-details" class="text-left space-y-4 mb-10 hidden max-h-64 overflow-y-auto pr-2 rounded-xl border border-slate-100 dark:border-slate-700 p-2">
          <!-- Injected review -->
        </div>

        <div id="result-actions"></div>
      </div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let questions = [];
    let currentIdx = 0;
    let answers = [];
    let courseId = null;
    let selectedOption = null;
    let courseTitle = '';

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      courseId = urlParams.get('course_id');
      if (!courseId) {
        window.location.href = 'dashboard.html';
        return;
      }

      try {
        const data = await apiFetch(`/quiz/course/${courseId}`);
        questions = data.questions || [];
        courseTitle = data.courseTitle || 'Course';
        document.getElementById('quiz-title').innerHTML = `<i data-lucide="graduation-cap" class="w-8 h-8 inline"></i> Course Final Exam: <span class="opacity-80 font-medium">${escapeHtml(courseTitle)}</span>`;
        document.getElementById('quiz-subtitle').textContent = `Comprehensive exam covering all lessons. Answer ${questions.length} questions. Earn 10 XP per correct question + 100 XP Course Completion Bonus (Need 70% to pass).`;
        
        if (questions.length === 0) {
          throw new Error("No questions available for this exam.");
        }
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('quiz-content').classList.remove('hidden');
        document.getElementById('quiz-content').classList.add('flex');
        
        renderQuestion();

      } catch(err) {
        document.getElementById('loading').innerHTML = `<div class="text-rose-500 font-medium">${escapeHtml(err.message)}</div>`;
      }
    });

    function renderQuestion() {
      const q = questions[currentIdx];
      document.getElementById('progress-text').textContent = `Question ${currentIdx + 1} of ${questions.length}`;
      document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
      
      document.getElementById('question-text').innerHTML = escapeHtml(q.text);
      
      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';
      selectedOption = null;
      document.getElementById('btn-next').disabled = true;

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('div');
        const letter = String.fromCharCode(65 + idx);
        btn.className = 'quiz-option p-4 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center gap-4 text-slate-700 dark:text-slate-200';
        btn.innerHTML = `
          <div class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center font-bold text-slate-500 dark:text-slate-400 shrink-0 option-letter">${letter}</div>
          <div class="flex-1">${escapeHtml(opt.text)}</div>
        `;
        btn.onclick = () => selectOption(btn, opt.id);
        optsContainer.appendChild(btn);
      });

      const nextBtn = document.getElementById('btn-next');
      nextBtn.textContent = currentIdx === questions.length - 1 ? 'Submit Exam' : 'Next Question →';
      nextBtn.onclick = handleNext;
    }

    function selectOption(btn, optId) {
      document.querySelectorAll('.quiz-option').forEach(el => {
        el.classList.remove('selected');
        el.querySelector('.option-letter').classList.remove('bg-indigo-600', 'text-white');
      });
      btn.classList.add('selected');
      btn.querySelector('.option-letter').classList.add('bg-indigo-600', 'text-white');
      
      selectedOption = optId;
      document.getElementById('btn-next').disabled = false;
    }

    async function handleNext() {
      answers.push({ questionId: questions[currentIdx].id, optionId: selectedOption });
      
      if (currentIdx < questions.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    }

    async function submitQuiz() {
      document.getElementById('quiz-content').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');

      try {
        const res = await apiFetch(`/quiz/course/${courseId}/submit`, {
          method: 'POST',
          body: JSON.stringify({ answers })
        });

        // Immediately update navbar XP
        if (res.new_xp !== undefined && window.updateUserXP) {
          updateUserXP(res.new_xp);
        }

        showResult(res);
      } catch(err) {
        document.getElementById('loading').innerHTML = `<div class="text-rose-500 font-medium">${escapeHtml(err.message)}</div><button onclick="window.location.reload()" class="mt-4 px-4 py-2 bg-indigo-100 text-indigo-700 rounded-lg">Try Again</button>`;
      }
    }

    function showResult(res) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      
      const isPass = res.passed;
      
      const icon = document.getElementById('result-icon');
      const title = document.getElementById('result-title');
      const score = document.getElementById('result-score');
      const msg = document.getElementById('result-msg');
      const badge = document.getElementById('result-badge');
      const actions = document.getElementById('result-actions');
      const details = document.getElementById('result-details');

      score.textContent = `Score: ${res.score}/${res.total}`;

      if (isPass) {
        icon.className = "w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 bg-gradient-to-br from-emerald-400 to-emerald-600 text-white shadow-emerald-500/50 shadow-lg";
        icon.innerHTML = '<i data-lucide="award" class="w-12 h-12"></i>';
        title.textContent = "Course Completed!";
        msg.innerHTML = `Congratulations! You have mastered <b>${escapeHtml(courseTitle)}</b>.`;
        badge.classList.remove('hidden');
        
        const finalXpText = document.getElementById('final-xp-text');
        if (res.xp_earned > 0) {
          if (res.completion_bonus > 0) {
            finalXpText.textContent = `+${res.xp_earned} XP Earned (${res.score * 10} Exam XP + ${res.completion_bonus} XP Completion Bonus)!`;
          } else {
            finalXpText.textContent = `+${res.xp_earned} XP Earned (${res.score}/${res.total} Correct)!`;
          }
        } else {
          finalXpText.textContent = `Course Mastered (${res.score}/${res.total} Correct)!`;
        }
        actions.innerHTML = `<a href="dashboard.html" class="inline-block px-10 py-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-black text-lg rounded-2xl shadow-xl shadow-indigo-600/30 transition-transform hover:scale-105">Back to Dashboard</a>`;
        createConfetti();
      } else {
        icon.className = "w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 bg-slate-100 dark:bg-slate-800 text-slate-400 shadow-inner";
        icon.innerHTML = '<i data-lucide="book-open" class="w-12 h-12"></i>';
        title.className = "text-4xl font-black text-slate-800 dark:text-slate-200 mb-2";
        title.textContent = "Keep studying!";
        msg.textContent = "You need 70% to pass the final exam. Review the material and try again.";
        actions.innerHTML = `<button onclick="window.location.reload()" class="inline-flex items-center gap-2 px-10 py-4 bg-indigo-100 hover:bg-indigo-200 dark:bg-indigo-900/30 dark:hover:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 font-bold text-lg rounded-2xl transition-colors"><i data-lucide="rotate-ccw" class="w-5 h-5"></i> Retry Exam</button>
        <a href="roadmap.html?course_id=${courseId}" class="block mt-4 text-sm text-slate-500 hover:underline">Review Course Roadmap</a>`;
      }

      if (window.lucide) lucide.createIcons();

      // Review
      details.classList.remove('hidden');
      details.innerHTML = res.results.map((r, i) => {
        const correct = r.isCorrect;
        return `
          <div class="p-4 rounded-xl border ${correct ? 'border-emerald-200 bg-emerald-50 dark:border-emerald-900/30 dark:bg-emerald-900/10' : 'border-rose-200 bg-rose-50 dark:border-rose-900/30 dark:bg-rose-900/10'}">
            <p class="font-bold text-slate-800 dark:text-slate-200 mb-2">${i+1}. ${escapeHtml(r.questionText)}</p>
            ${!correct ? `<p class="text-sm text-rose-600 dark:text-rose-400 mb-1">Your answer: <span class="font-medium">${escapeHtml(r.userAnswerText)}</span></p>` : ''}
            <p class="text-sm ${correct ? 'text-emerald-700 dark:text-emerald-400' : 'text-slate-700 dark:text-slate-300'} font-medium">Correct answer: ${escapeHtml(r.correctAnswerText)}</p>
          </div>
        `;
      }).join('');
    }

    function createConfetti() {
      for(let i=0; i<60; i++) {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.backgroundColor = ['#f2d74e', '#95c3de', '#ff9a91', '#a2d39c', '#9b5de5', '#f15bb5'][Math.floor(Math.random()*6)];
        conf.style.animationDelay = Math.random() * 3 + 's';
        conf.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
        conf.style.transform = `rotate(${Math.random() * 360}deg)`;
        conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        document.body.appendChild(conf);
      }
    }
  </script>
</body>
</html>
