<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progressive Learning — Course Final Examination</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .confetti {
      position: fixed;
      width: 10px; height: 10px;
      animation: confetti-fall 3s ease-in-out infinite;
      z-index: 100;
      top: -10px;
    }
    .quiz-option {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .quiz-option:hover {
      border-color: #e03131;
      transform: translateY(-1px);
    }
    .quiz-option.selected {
      border-color: #e03131 !important;
      background-color: rgba(254, 242, 242, 0.6) !important;
      box-shadow: 0 0 0 3px rgba(224, 49, 49, 0.15);
    }
    .dark .quiz-option.selected {
      background-color: rgba(224, 49, 49, 0.15) !important;
    }
  </style>
</head>
<body class="bg-app-canvas min-h-screen flex flex-col text-slate-800 dark:text-slate-100 antialiased selection:bg-rose-100 selection:text-rose-900 relative">

  <!-- Ambient decorative accents -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-12 -left-12 w-64 h-64 rounded-full border border-dashed border-amber-300/40 opacity-70"></div>
    <div class="absolute top-36 right-8 flex flex-col gap-2.5 opacity-50 -rotate-45">
      <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
      <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
      <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
    </div>
  </div>

  <div id="navbar" class="relative z-40"></div>

  <main class="relative z-10 flex-1 flex items-center justify-center p-4 sm:p-6">
    <div id="quiz-container" class="w-full max-w-2xl app-card rounded-3xl overflow-hidden shadow-2xl">
      
      <div id="loading" class="p-12 text-center">
        <div class="spinner mx-auto mb-4"></div>
        <p class="text-slate-500 font-medium text-sm">Assembling Course Final Exam...</p>
      </div>

      <!-- Quiz Content -->
      <div id="quiz-content" class="hidden flex flex-col h-full">
        <div class="p-6 md:p-8 bg-[#1c1e24] text-white relative overflow-hidden border-b border-slate-800">
          <div class="flex items-center justify-between mb-2">
            <h1 id="quiz-title" class="text-xl md:text-2xl font-extrabold flex items-center gap-2.5 tracking-tight">
              <i data-lucide="graduation-cap" class="w-7 h-7 text-rose-500"></i> Course Final Exam
            </h1>
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-amber-400/20 text-amber-300 border border-amber-400/30">
              <i data-lucide="zap" class="w-3.5 h-3.5"></i> +100 XP Bonus
            </span>
          </div>
          <p id="quiz-subtitle" class="text-slate-300 text-xs sm:text-sm font-medium leading-relaxed">Comprehensive final assessment covering all course lessons.</p>
          
          <div class="mt-6">
            <div class="flex justify-between text-xs font-bold text-slate-300 mb-2">
              <span id="progress-text">Question 1 of 5</span>
            </div>
            <div class="w-full bg-white/15 rounded-full h-2 overflow-hidden">
              <div id="progress-bar" class="bg-gradient-to-r from-amber-400 via-rose-500 to-rose-600 h-full rounded-full transition-all duration-300" style="width: 20%"></div>
            </div>
          </div>
        </div>

        <div class="p-6 md:p-8 flex-1 bg-white dark:bg-slate-800">
          <h2 id="question-text" class="text-base sm:text-lg md:text-xl font-bold text-slate-900 dark:text-white mb-6 leading-relaxed">Question goes here?</h2>
          <div id="options-container" class="space-y-3"></div>
        </div>

        <div class="p-6 border-t border-slate-100 dark:border-slate-800 flex justify-end bg-slate-50/50 dark:bg-slate-900/40">
          <button id="btn-next" disabled class="btn-red-cta disabled:opacity-40 disabled:pointer-events-none px-7 py-3 font-bold text-xs sm:text-sm rounded-xl transition-all cursor-pointer flex items-center gap-2">
            <span>Next Question</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Result Screen -->
      <div id="result-screen" class="hidden p-8 md:p-12 text-center bg-white dark:bg-slate-800">
        <div id="result-icon" class="w-24 h-24 rounded-3xl flex items-center justify-center text-5xl mx-auto mb-6 shadow-lg"></div>
        <h2 id="result-title" class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white mb-2 tracking-tight">Result</h2>
        <p id="result-score" class="text-xl font-bold text-slate-700 dark:text-slate-200 mb-4"></p>
        
        <div id="result-badge" class="mb-6 hidden">
          <span id="final-xp-badge" class="inline-flex items-center gap-2 px-5 py-2 bg-gradient-to-r from-amber-400 to-rose-500 text-white text-base font-extrabold rounded-full shadow-md cursor-default">
            <i data-lucide="zap" class="w-4 h-4 text-white"></i> <span id="final-xp-text">+0 XP Earned!</span>
          </span>
        </div>
        
        <p id="result-msg" class="text-sm sm:text-base font-medium text-slate-600 dark:text-slate-400 mb-8 max-w-md mx-auto"></p>

        <div id="result-details" class="text-left space-y-4 mb-8 hidden max-h-64 overflow-y-auto pr-2 rounded-2xl border border-slate-100 dark:border-slate-800 p-3">
          <!-- Injected review -->
        </div>

        <div id="result-actions"></div>
      </div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let questions = [];
    let currentIdx = 0;
    let answers = [];
    let courseId = null;
    let selectedOption = null;
    let courseTitle = '';

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      courseId = urlParams.get('course_id');
      if (!courseId) {
        window.location.href = 'dashboard.html';
        return;
      }

      try {
        const data = await apiFetch(`/quiz/course/${courseId}`);
        questions = data.questions || [];
        courseTitle = data.courseTitle || 'Course';
        document.getElementById('quiz-title').innerHTML = `<i data-lucide="graduation-cap" class="w-7 h-7 text-rose-500 inline"></i> <span>Final Exam: ${escapeHtml(courseTitle)}</span>`;
        document.getElementById('quiz-subtitle').textContent = `Comprehensive exam covering all lessons. Answer ${questions.length} questions. Earn 10 XP per correct question + 100 XP Course Completion Bonus.`;
        
        if (questions.length === 0) {
          throw new Error("No questions available for this exam.");
        }
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('quiz-content').classList.remove('hidden');
        document.getElementById('quiz-content').classList.add('flex');
        
        renderQuestion();

      } catch(err) {
        document.getElementById('loading').innerHTML = `<div class="text-rose-500 font-medium">${escapeHtml(err.message)}</div>`;
      }
    });

    function renderQuestion() {
      const q = questions[currentIdx];
      document.getElementById('progress-text').textContent = `Question ${currentIdx + 1} of ${questions.length}`;
      document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
      
      document.getElementById('question-text').innerHTML = escapeHtml(q.text);
      
      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';
      selectedOption = null;
      document.getElementById('btn-next').disabled = true;

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('div');
        const letter = String.fromCharCode(65 + idx);
        btn.className = 'quiz-option p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center gap-4 text-slate-700 dark:text-slate-200';
        btn.innerHTML = `
          <div class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center font-extrabold text-xs text-slate-600 dark:text-slate-300 shrink-0 option-letter">${letter}</div>
          <div class="flex-1 text-sm font-semibold">${escapeHtml(opt.text)}</div>
        `;
        btn.onclick = () => selectOption(btn, opt.id);
        optsContainer.appendChild(btn);
      });

      const nextBtn = document.getElementById('btn-next');
      nextBtn.innerHTML = currentIdx === questions.length - 1 ? '<span>Submit Final Exam</span> <i data-lucide="check" class="w-4 h-4"></i>' : '<span>Next Question</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
      nextBtn.onclick = handleNext;
      if (window.lucide) lucide.createIcons();
    }

    function selectOption(btn, optId) {
      document.querySelectorAll('.quiz-option').forEach(el => {
        el.classList.remove('selected');
        el.querySelector('.option-letter').classList.remove('bg-[#e03131]', 'text-white');
      });
      btn.classList.add('selected');
      btn.querySelector('.option-letter').classList.add('bg-[#e03131]', 'text-white');
      
      selectedOption = optId;
      document.getElementById('btn-next').disabled = false;
    }

    async function handleNext() {
      answers.push({ questionId: questions[currentIdx].id, optionId: selectedOption });
      
      if (currentIdx < questions.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    }

    async function submitQuiz() {
      document.getElementById('quiz-content').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');

      try {
        const res = await apiFetch(`/quiz/course/${courseId}/submit`, {
          method: 'POST',
          body: JSON.stringify({ answers })
        });

        if (res.new_xp !== undefined && window.updateUserXP) {
          updateUserXP(res.new_xp);
        }

        showResult(res);
      } catch(err) {
        document.getElementById('loading').innerHTML = `<div class="text-rose-500 font-medium">${escapeHtml(err.message)}</div><button onclick="window.location.reload()" class="btn-dark-pill mt-4 px-4 py-2 rounded-xl text-xs">Try Again</button>`;
      }
    }

    function showResult(res) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      
      const isPass = res.passed;
      
      const icon = document.getElementById('result-icon');
      const title = document.getElementById('result-title');
      const score = document.getElementById('result-score');
      const msg = document.getElementById('result-msg');
      const badge = document.getElementById('result-badge');
      const actions = document.getElementById('result-actions');
      const details = document.getElementById('result-details');

      score.textContent = `Score: ${res.score}/${res.total}`;

      if (isPass) {
        icon.className = "w-24 h-24 rounded-3xl flex items-center justify-center mx-auto mb-6 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 border border-emerald-100 dark:border-emerald-800";
        icon.innerHTML = '<i data-lucide="award" class="w-12 h-12"></i>';
        title.textContent = "Course Completed!";
        msg.innerHTML = `Congratulations! You have mastered <b>${escapeHtml(courseTitle)}</b>.`;
        badge.classList.remove('hidden');
        
        const finalXpText = document.getElementById('final-xp-text');
        if (res.xp_earned > 0) {
          if (res.completion_bonus > 0) {
            finalXpText.textContent = `+${res.xp_earned} XP Earned (${res.score * 10} Exam XP + ${res.completion_bonus} XP Completion Bonus)!`;
          } else {
            finalXpText.textContent = `+${res.xp_earned} XP Earned (${res.score}/${res.total} Correct)!`;
          }
        } else {
          finalXpText.textContent = `Course Mastered (${res.score}/${res.total} Correct)!`;
        }
        actions.innerHTML = `<a href="dashboard.html" class="btn-red-cta inline-flex items-center gap-2 px-9 py-3.5 font-extrabold text-sm rounded-2xl shadow-lg cursor-pointer"><span>Back to Dashboard</span> <i data-lucide="arrow-right" class="w-4 h-4"></i></a>`;
        createConfetti();
      } else {
        icon.className = "w-24 h-24 rounded-3xl flex items-center justify-center mx-auto mb-6 bg-rose-50 dark:bg-rose-900/30 text-rose-600 border border-rose-100 dark:border-rose-800";
        icon.innerHTML = '<i data-lucide="book-open" class="w-12 h-12"></i>';
        title.textContent = "Keep studying!";
        msg.textContent = "Review the material and try again to complete the course!";
        actions.innerHTML = `
          <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <button onclick="window.location.reload()" class="btn-red-cta px-6 py-3 font-bold rounded-xl text-xs cursor-pointer flex items-center justify-center gap-1.5"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Retry Exam</button>
            <a href="roadmap.html?course_id=${courseId}" class="btn-dark-pill px-6 py-3 font-bold rounded-xl text-xs cursor-pointer flex items-center justify-center gap-1.5"><i data-lucide="map" class="w-3.5 h-3.5"></i> Course Roadmap</a>
          </div>
        `;
      }

      if (window.lucide) lucide.createIcons();

      // Review
      details.classList.remove('hidden');
      details.innerHTML = res.results.map((r, i) => {
        const correct = r.isCorrect;
        return `
          <div class="p-4 rounded-2xl border ${correct ? 'border-emerald-200 bg-emerald-50/50 dark:border-emerald-900/30 dark:bg-emerald-900/10' : 'border-rose-200 bg-rose-50/50 dark:border-rose-900/30 dark:bg-rose-900/10'}">
            <p class="font-bold text-xs sm:text-sm text-slate-800 dark:text-slate-200 mb-2">${i+1}. ${escapeHtml(r.questionText)}</p>
            ${!correct ? `<p class="text-xs text-rose-600 dark:text-rose-400 mb-1">Your answer: <span class="font-medium">${escapeHtml(r.userAnswerText)}</span></p>` : ''}
            <p class="text-xs ${correct ? 'text-emerald-700 dark:text-emerald-400' : 'text-slate-700 dark:text-slate-300'} font-semibold">Correct answer: ${escapeHtml(r.correctAnswerText)}</p>
          </div>
        `;
      }).join('');
    }

    function createConfetti() {
      for(let i=0; i<60; i++) {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.backgroundColor = ['#facc15', '#fb7185', '#34d399', '#60a5fa', '#e03131'][Math.floor(Math.random()*5)];
        conf.style.animationDelay = Math.random() * 3 + 's';
        conf.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
        conf.style.transform = `rotate(${Math.random() * 360}deg)`;
        conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 4000);
      }
    }
  </script>
</body>
</html>
