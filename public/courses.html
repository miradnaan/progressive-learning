<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progressive Learning — Course Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-app-canvas min-h-screen text-slate-800 dark:text-slate-100 antialiased selection:bg-rose-100 selection:text-rose-900 relative">

  <!-- Ambient decorative geometric accents -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-12 -left-12 w-64 h-64 rounded-full border border-dashed border-amber-300/40 opacity-70"></div>
    <div class="absolute top-28 left-6 flex flex-col gap-2.5 opacity-50 rotate-45">
      <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
      <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
      <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
      <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
    </div>
    <div class="absolute -top-10 -right-10 w-72 h-72 rounded-full border border-dashed border-rose-300/40 opacity-60"></div>
    <div class="absolute bottom-16 -right-8 w-60 h-60 rounded-full border border-dashed border-amber-300/40 opacity-50"></div>
  </div>

  <div id="navbar" class="relative z-40"></div>

  <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 py-8">
    
    <!-- Header Section -->
    <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/90 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 shadow-xs mb-2.5 text-xs font-semibold text-slate-600 dark:text-slate-300">
          <span class="w-2 h-2 rounded-full bg-rose-500"></span>
          <span>Course Catalog</span>
          <span class="text-slate-300 dark:text-slate-600">•</span>
          <span class="text-slate-500 dark:text-slate-400 font-normal">Sequential mastery curriculums</span>
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight">
          Explore Courses
        </h1>
        <p class="text-slate-500 dark:text-slate-400 mt-1 text-sm">
          Discover structured skills, pass quizzes, and level up your mastery.
        </p>
      </div>
      
      <!-- Dynamic Category Filter Pills Bar -->
      <div id="category-filter-bar" class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
        <!-- Injected via JavaScript -->
      </div>
    </div>

    <!-- Courses Grid -->
    <div id="courses-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-20">
        <div class="spinner mx-auto mb-4"></div>
        <p class="text-slate-500 text-sm font-medium">Loading courses...</p>
      </div>
    </div>
  </main>

  <!-- Confirm Unlock Modal -->
  <div id="unlock-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
    <div class="app-card rounded-3xl max-w-sm w-full p-6 sm:p-7 transform scale-95 transition-transform">
      <div class="w-12 h-12 rounded-2xl bg-amber-50 dark:bg-amber-900/30 border border-amber-100 dark:border-amber-800 flex items-center justify-center text-amber-600 mx-auto mb-4 shadow-xs">
        <i data-lucide="zap" class="w-6 h-6"></i>
      </div>
      <h3 class="text-xl font-extrabold text-center text-slate-900 dark:text-white mb-2 tracking-tight">Unlock Course</h3>
      <p id="unlock-msg" class="text-center text-slate-600 dark:text-slate-400 mb-6 text-xs sm:text-sm leading-relaxed"></p>
      
      <div class="flex gap-3">
        <button onclick="closeModal()" class="flex-1 py-2.5 bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors cursor-pointer">Cancel</button>
        <button id="unlock-confirm-btn" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-xs shadow-md shadow-amber-500/25 transition-colors cursor-pointer">Unlock</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let currentCourses = [];
    let selectedCourseId = null;
    let selectedCategory = 'All';

    // Utility: Safe JS escape for inline onclick handlers
    function jsEscape(str) {
      if (!str) return '';
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const catParam = urlParams.get('category');
        if (catParam) {
          selectedCategory = catParam;
        }

        const data = await apiFetch('/courses');
        currentCourses = data.courses || [];
        renderCategoryFilterBar();
        renderCourses();
      } catch (err) {
        document.getElementById('courses-grid').innerHTML = `<div class="col-span-full text-center text-rose-500 p-8 font-medium">Failed to load courses.</div>`;
      }
    });

    function getUniqueCategories() {
      const cats = new Set();
      currentCourses.forEach(c => {
        if (c.category && c.category.trim()) {
          cats.add(c.category.trim());
        }
      });
      return ['All', ...Array.from(cats).sort()];
    }

    function renderCategoryFilterBar() {
      const bar = document.getElementById('category-filter-bar');
      if (!bar) return;
      const categories = getUniqueCategories();

      bar.innerHTML = categories.map(cat => {
        const isActive = (selectedCategory || 'All').toLowerCase() === cat.toLowerCase();
        if (isActive) {
          return `<button onclick="filterByCategory('${jsEscape(cat)}')" class="px-4 py-2 bg-[#1c1e24] text-white rounded-full text-xs font-bold whitespace-nowrap shadow-sm transition-all flex items-center gap-1.5 cursor-pointer">
            ${cat !== 'All' ? '<i data-lucide="tag" class="w-3.5 h-3.5 text-rose-400"></i>' : ''}
            ${escapeHtml(cat)}
          </button>`;
        } else {
          return `<button onclick="filterByCategory('${jsEscape(cat)}')" class="px-4 py-2 bg-white/90 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:border-slate-300 hover:text-slate-900 rounded-full text-xs font-bold whitespace-nowrap transition-all cursor-pointer">
            ${escapeHtml(cat)}
          </button>`;
        }
      }).join('');

      if (window.lucide) lucide.createIcons();
    }

    function filterByCategory(cat) {
      selectedCategory = cat;
      renderCategoryFilterBar();
      renderCourses();

      const url = new URL(window.location);
      if (cat === 'All') {
        url.searchParams.delete('category');
      } else {
        url.searchParams.set('category', cat);
      }
      window.history.replaceState({}, '', url);
    }

    function renderCourses() {
      const grid = document.getElementById('courses-grid');
      const user = getUser();
      const userXp = user ? user.xp : 0;
      const isInstructor = user && (user.role === 'instructor' || user.role === 'admin');

      if(currentCourses.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-500 font-medium">No courses available.</div>`;
        return;
      }

      let filteredCourses = currentCourses;
      if (selectedCategory && selectedCategory.toLowerCase() !== 'all') {
        filteredCourses = currentCourses.filter(c => (c.category || 'General').toLowerCase() === selectedCategory.toLowerCase());
      }

      // Instructor notice banner
      const instructorBanner = isInstructor ? `
        <div class="col-span-full mb-2 p-5 app-card rounded-3xl flex items-center justify-between gap-4">
          <div class="flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-2xl bg-[#1c1e24] text-white flex items-center justify-center font-bold text-xs shadow-xs">
              <i data-lucide="shield" class="w-5 h-5"></i>
            </div>
            <div>
              <p class="text-sm font-extrabold text-slate-900 dark:text-white">Instructor Catalog Access</p>
              <p class="text-xs text-slate-500 dark:text-slate-400">You have full creator access to preview roadmaps and manage curriculum without enrolling.</p>
            </div>
          </div>
          <a href="studio.html" class="btn-dark-pill px-4 py-2 text-xs font-bold rounded-xl transition-all shadow-xs shrink-0 flex items-center gap-1.5">
            <span>Open Studio</span>
            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
          </a>
        </div>` : '';

      if (filteredCourses.length === 0) {
        grid.innerHTML = instructorBanner + `
          <div class="col-span-full text-center py-16 app-card rounded-3xl p-8">
            <div class="w-12 h-12 rounded-2xl bg-rose-50 dark:bg-rose-900/30 text-rose-500 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="filter" class="w-6 h-6"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-200 mb-1">No courses found</h3>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mb-4">No courses currently match the category "<strong>${escapeHtml(selectedCategory)}</strong>".</p>
            <button onclick="filterByCategory('All')" class="btn-dark-pill px-5 py-2.5 text-xs font-bold rounded-xl transition-all cursor-pointer">
              Show All Courses
            </button>
          </div>
        `;
        if (window.lucide) lucide.createIcons();
        return;
      }

      grid.innerHTML = instructorBanner + filteredCourses.map(course => {
        let actionBtn = '';
        let costBadge = '';

        if (isInstructor) {
          costBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-1 bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-300 text-xs font-bold rounded-full"><i data-lucide="shield-check" class="w-3 h-3 text-rose-500"></i> Full Access</span>`;
          actionBtn = `
            <div class="grid grid-cols-2 gap-2">
              <a href="roadmap.html?course_id=${course.id}" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700/60 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold rounded-xl text-center text-xs transition-colors flex items-center justify-center gap-1.5">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i> Preview
              </a>
              <a href="studio.html?tab=lessons&course_id=${course.id}" class="btn-dark-pill py-2.5 px-3 font-bold rounded-xl text-center text-xs transition-all flex items-center justify-center gap-1.5">
                <i data-lucide="settings" class="w-3.5 h-3.5"></i> Manage
              </a>
            </div>
          `;
        } else if (course.enrolled) {
          actionBtn = `<a href="roadmap.html?course_id=${course.id}" class="btn-dark-pill w-full block text-center py-2.5 font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1.5"><span>Continue Learning</span> <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></a>`;
          costBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 text-xs font-bold rounded-full border border-emerald-200/60"><i data-lucide="check" class="w-3 h-3"></i> Enrolled</span>`;
        } else if (course.cost === 0) {
          actionBtn = `<button onclick="enrollFree(${course.id})" class="btn-red-cta w-full py-2.5 font-bold rounded-xl text-xs transition-all cursor-pointer flex items-center justify-center gap-1.5"><span>Enroll Free</span> <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></button>`;
          costBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 text-xs font-bold rounded-full border border-emerald-200/60"><i data-lucide="check" class="w-3 h-3"></i> Free</span>`;
        } else {
          actionBtn = `<button onclick="promptUnlock(${course.id}, ${course.cost})" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-xs transition-colors shadow-md shadow-amber-500/25 cursor-pointer flex items-center justify-center gap-1.5"><i data-lucide="zap" class="w-3.5 h-3.5"></i> Unlock for ${course.cost} XP</button>`;
          costBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-1 bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 text-xs font-bold rounded-full border border-amber-200/60"><i data-lucide="zap" class="w-3 h-3"></i> ${course.cost} XP Required</span>`;
        }

        return `
          <div class="app-card rounded-3xl overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col">
            <div class="h-48 bg-slate-200 dark:bg-slate-700 relative overflow-hidden">
              ${course.image_url ? `<img src="${escapeHtml(course.image_url)}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-400"><i data-lucide="book-open" class="w-12 h-12"></i></div>`}
              <div class="absolute top-3 left-3">
                <button type="button" onclick="filterByCategory('${jsEscape(course.category || 'General')}')" title="Filter by category" class="inline-flex items-center gap-1.5 px-3 py-1 bg-white/95 dark:bg-slate-900/95 backdrop-blur text-slate-800 dark:text-slate-200 text-xs font-bold rounded-full shadow-xs hover:shadow transition-all cursor-pointer">
                  <i data-lucide="tag" class="w-3 h-3 text-rose-500"></i>
                  <span>${escapeHtml(course.category || 'General')}</span>
                </button>
              </div>
            </div>
            <div class="p-6 flex-1 flex flex-col">
              <div class="flex justify-between items-start mb-2">
                <h3 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white line-clamp-1 tracking-tight">${escapeHtml(course.title)}</h3>
              </div>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mb-4 line-clamp-2 flex-1 leading-relaxed">${escapeHtml(course.description)}</p>
              
              <div class="flex items-center justify-between mb-5 pt-3 border-t border-slate-100 dark:border-slate-800">
                <span class="text-xs text-slate-500 font-medium flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i> ${escapeHtml(course.duration || '2 hours')}</span>
                ${costBadge}
              </div>
              
              <div class="mt-auto">
                ${actionBtn}
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) lucide.createIcons();
    }

    async function enrollFree(id) {
      try {
        await apiFetch(`/courses/${id}/enroll`, { method: 'POST' });
        showToast('Enrolled successfully!');
        setTimeout(() => window.location.href = `roadmap.html?course_id=${id}`, 1000);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function promptUnlock(id, cost) {
      selectedCourseId = id;
      const user = getUser();
      const modal = document.getElementById('unlock-modal');
      const msg = document.getElementById('unlock-msg');
      const confirmBtn = document.getElementById('unlock-confirm-btn');

      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      if ((user.xp || 0) < cost) {
        msg.innerHTML = `You have <span class="font-bold text-amber-500">${user.xp || 0} XP</span>, but this course requires <span class="font-bold text-amber-500">${cost} XP</span>.<br><br>Complete lessons and pass quizzes in your current courses to earn more XP!`;
        confirmBtn.style.display = 'none';
      } else {
        msg.innerHTML = `Are you sure you want to spend <span class="font-bold text-amber-500">${cost} XP</span> to unlock this course?<br><br>Your remaining balance will be <strong>${(user.xp || 0) - cost} XP</strong>.`;
        confirmBtn.style.display = 'block';
        confirmBtn.onclick = () => confirmUnlock(id);
      }

      modal.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    async function confirmUnlock(id) {
      try {
        const res = await apiFetch(`/courses/${id}/enroll`, { method: 'POST' });
        
        const user = getUser();
        if (user && res.new_xp !== undefined) {
          user.xp = res.new_xp;
          setAuth(getToken(), user);
          if (window.updateUserXP) updateUserXP(user.xp);
        }

        showToast('Course unlocked successfully!');
        closeModal();
        setTimeout(() => window.location.href = `roadmap.html?course_id=${id}`, 800);
      } catch (err) {
        showToast(err.message, 'error');
        closeModal();
      }
    }

    function closeModal() {
      document.getElementById('unlock-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
