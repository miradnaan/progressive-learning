<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progressive Learning - Lesson Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Add confetti style for completion */
    .confetti {
      position: fixed;
      width: 10px; height: 10px;
      background-color: #f2d74e;
      animation: confetti-fall 3s ease-in-out infinite;
      z-index: 100;
      top: -10px;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen flex flex-col">
  <div id="navbar"></div>

  <main class="flex-1 flex items-center justify-center p-4">
    <div id="quiz-container" class="w-full max-w-2xl bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
      
      <!-- Loading State -->
      <div id="loading" class="p-12 text-center">
        <div class="spinner mx-auto mb-4"></div>
        <p class="text-slate-500">Preparing your quiz...</p>
      </div>

      <!-- Quiz Content -->
      <div id="quiz-content" class="hidden flex flex-col h-full">
        <div class="p-6 md:p-8 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
          <h1 id="quiz-title" class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white mb-2">Lesson Quiz</h1>
          <p id="quiz-subtitle" class="text-sm text-slate-500 dark:text-slate-400">Answer 4 questions. Earn 10 XP per correct question (min. 70% to pass).</p>
          
          <div class="mt-6">
            <div class="flex justify-between text-xs font-bold text-slate-500 mb-2">
              <span id="progress-text">Question 1 of 4</span>
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2">
              <div id="progress-bar" class="bg-indigo-500 h-2 rounded-full transition-all duration-300" style="width: 25%"></div>
            </div>
          </div>
        </div>

        <div class="p-6 md:p-8 flex-1">
          <h2 id="question-text" class="text-lg md:text-xl font-medium text-slate-800 dark:text-slate-200 mb-6">Question goes here?</h2>
          
          <div id="options-container" class="space-y-3">
            <!-- Injected -->
          </div>
        </div>

        <div class="p-6 border-t border-slate-100 dark:border-slate-700 flex justify-end bg-slate-50/50 dark:bg-slate-900/50">
          <button id="btn-next" disabled class="px-6 py-2.5 bg-indigo-600 disabled:bg-slate-300 disabled:dark:bg-slate-700 text-white font-medium rounded-xl transition-colors">Next Question →</button>
        </div>
      </div>

      <!-- Result Screen -->
      <div id="result-screen" class="hidden p-8 md:p-12 text-center">
        <div id="result-icon" class="w-20 h-20 rounded-full flex items-center justify-center text-4xl mx-auto mb-6"></div>
        <h2 id="result-title" class="text-3xl font-bold text-slate-900 dark:text-white mb-2">Result</h2>
        <p id="result-score" class="text-xl text-slate-600 dark:text-slate-300 mb-4"></p>
        <div id="result-badge" class="mb-8 hidden">
          <span class="inline-flex items-center gap-1.5 px-4 py-1.5 bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 font-bold rounded-full border border-amber-200 dark:border-amber-800 shadow-sm"><i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> <span id="xp-badge-text">+0 XP Earned!</span></span>
        </div>
        
        <p id="result-msg" class="text-slate-500 mb-8"></p>

        <div id="result-details" class="text-left space-y-4 mb-8 hidden">
          <!-- Injected review -->
        </div>

        <div id="result-actions"></div>
      </div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let questions = [];
    let currentIdx = 0;
    let answers = [];
    let lessonId = null;
    let selectedOption = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      lessonId = urlParams.get('lesson_id');
      if (!lessonId) {
        window.location.href = 'dashboard.html';
        return;
      }

      try {
        const data = await apiFetch(`/quiz/lesson/${lessonId}`);
        questions = data.questions || [];
        document.getElementById('quiz-title').textContent = `Lesson Quiz: ${data.lessonTitle || 'Lesson'}`;
        document.getElementById('quiz-subtitle').textContent = `Answer ${questions.length} questions. Earn 10 XP per correct question (min. 70% to pass).`;
        
        if (questions.length === 0) {
          throw new Error("No questions available for this quiz.");
        }
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('quiz-content').classList.remove('hidden');
        document.getElementById('quiz-content').classList.add('flex');
        
        renderQuestion();

      } catch(err) {
        document.getElementById('loading').innerHTML = `<div class="text-rose-500">${escapeHtml(err.message)}</div>`;
      }
    });

    function renderQuestion() {
      const q = questions[currentIdx];
      document.getElementById('progress-text').textContent = `Question ${currentIdx + 1} of ${questions.length}`;
      document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
      
      document.getElementById('question-text').innerHTML = escapeHtml(q.text);
      
      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';
      selectedOption = null;
      document.getElementById('btn-next').disabled = true;

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('div');
        const letter = String.fromCharCode(65 + idx);
        btn.className = 'quiz-option p-4 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center gap-4 text-slate-700 dark:text-slate-200';
        btn.innerHTML = `
          <div class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center font-bold text-slate-500 dark:text-slate-400 shrink-0 option-letter">${letter}</div>
          <div class="flex-1">${escapeHtml(opt.text)}</div>
        `;
        btn.onclick = () => selectOption(btn, opt.id);
        optsContainer.appendChild(btn);
      });

      const nextBtn = document.getElementById('btn-next');
      nextBtn.textContent = currentIdx === questions.length - 1 ? 'Submit Quiz' : 'Next Question →';
      nextBtn.onclick = handleNext;
    }

    function selectOption(btn, optId) {
      document.querySelectorAll('.quiz-option').forEach(el => {
        el.classList.remove('selected');
        el.querySelector('.option-letter').classList.remove('bg-indigo-600', 'text-white');
      });
      btn.classList.add('selected');
      btn.querySelector('.option-letter').classList.add('bg-indigo-600', 'text-white');
      
      selectedOption = optId;
      document.getElementById('btn-next').disabled = false;
    }

    async function handleNext() {
      answers.push({ questionId: questions[currentIdx].id, optionId: selectedOption });
      
      if (currentIdx < questions.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    }

    async function submitQuiz() {
      document.getElementById('quiz-content').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');

      try {
        const res = await apiFetch(`/quiz/lesson/${lessonId}/submit`, {
          method: 'POST',
          body: JSON.stringify({ answers })
        });
        
        // Immediately update navbar XP
        if (res.new_xp !== undefined && window.updateUserXP) {
          updateUserXP(res.new_xp);
        }

        showResult(res);

      } catch(err) {
        document.getElementById('loading').innerHTML = `<div class="text-rose-500">${escapeHtml(err.message)}</div><button onclick="window.location.reload()" class="mt-4 text-indigo-600">Try Again</button>`;
      }
    }

    function showResult(res) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      
      const isPass = res.passed;
      
      const icon = document.getElementById('result-icon');
      const title = document.getElementById('result-title');
      const score = document.getElementById('result-score');
      const msg = document.getElementById('result-msg');
      const badge = document.getElementById('result-badge');
      const actions = document.getElementById('result-actions');
      const details = document.getElementById('result-details');

      score.textContent = `You scored ${res.score}/${res.total}`;

      if (isPass) {
        icon.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-500";
        icon.innerHTML = '<i data-lucide="trophy" class="w-10 h-10"></i>';
        title.textContent = "Quiz Passed!";
        msg.textContent = "Great job! You've mastered this lesson.";
        badge.classList.remove('hidden');
        const xpBadgeText = document.getElementById('xp-badge-text');
        if (res.xp_earned > 0) {
          xpBadgeText.textContent = `+${res.xp_earned} XP Earned (${res.score}/${res.total} Correct)!`;
        } else {
          xpBadgeText.textContent = `Lesson Mastered (${res.score}/${res.total} Correct)`;
        }
        actions.innerHTML = `<a href="lesson.html?id=${res.nextLessonId || lessonId}" class="inline-block px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-transform hover:scale-105">Continue →</a>`;
        createConfetti();
      } else {
        icon.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 bg-rose-100 dark:bg-rose-900/30 text-rose-500";
        icon.innerHTML = '<i data-lucide="alert-circle" class="w-10 h-10"></i>';
        title.textContent = "Not quite there yet";
        msg.textContent = "You need at least 70% to pass. Review the lesson and try again.";
        actions.innerHTML = `<button onclick="window.location.reload()" class="inline-flex items-center gap-2 px-8 py-3 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-200 font-bold rounded-xl shadow-md transition-colors"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> Retry Quiz</button>`;
      }

      if (window.lucide) lucide.createIcons();

      // Review
      details.classList.remove('hidden');
      details.innerHTML = res.results.map((r, i) => {
        const correct = r.isCorrect;
        return `
          <div class="p-4 rounded-xl border ${correct ? 'border-emerald-200 bg-emerald-50 dark:border-emerald-900/30 dark:bg-emerald-900/10' : 'border-rose-200 bg-rose-50 dark:border-rose-900/30 dark:bg-rose-900/10'}">
            <p class="font-medium text-slate-800 dark:text-slate-200 mb-2">${i+1}. ${escapeHtml(r.questionText)}</p>
            ${!correct ? `<p class="text-sm text-rose-600 dark:text-rose-400">Your answer: ${escapeHtml(r.userAnswerText)}</p>` : ''}
            <p class="text-sm ${correct ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-600 dark:text-slate-400 mt-1'} font-medium">Correct answer: ${escapeHtml(r.correctAnswerText)}</p>
          </div>
        `;
      }).join('');
    }

    function createConfetti() {
      for(let i=0; i<30; i++) {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.backgroundColor = ['#f2d74e', '#95c3de', '#ff9a91', '#a2d39c'][Math.floor(Math.random()*4)];
        conf.style.animationDelay = Math.random() * 2 + 's';
        conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
        document.body.appendChild(conf);
      }
    }
  </script>
</body>
</html>
