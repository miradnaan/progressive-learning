<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="py-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A9FD4" />
      <stop offset="100%" stop-color="#306998" />
    </linearGradient>
    <linearGradient id="py-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD43B" />
      <stop offset="100%" stop-color="#FFE873" />
    </linearGradient>
    <radialGradient id="pyBlueGlow" cx="40%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#306998" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#306998" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pyYellowGlow" cx="60%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#FFD43B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFD43B" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.45" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#080D18" />
  <rect width="800" height="480" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <circle cx="340" cy="180" r="230" fill="url(#pyBlueGlow)" />
  <circle cx="460" cy="200" r="230" fill="url(#pyYellowGlow)" />

  <!-- Subtle Code Hints -->
  <text x="80" y="110" font-family="ui-monospace, monospace" font-size="16" fill="#38BDF8" opacity="0.22">def solve_problem(data):</text>
  <text x="100" y="150" font-family="ui-monospace, monospace" font-size="16" fill="#60A5FA" opacity="0.18">return [x**2 for x in data]</text>
  <text x="560" y="110" font-family="ui-monospace, monospace" font-size="16" fill="#FDE047" opacity="0.22">import math, sys</text>
  <text x="540" y="150" font-family="ui-monospace, monospace" font-size="16" fill="#FACC15" opacity="0.18">print(f"Success: {res}")</text>

  <!-- Official Python Logo (Devicon Official) -->
  <g transform="translate(305, 50) scale(1.5)">
    <!-- Blue snake -->
    <path fill="url(#py-blue)" d="M63.391 1.988c-4.222.02-8.252.379-11.8 1.007-10.45 1.846-12.346 5.71-12.346 12.837v9.411h24.693v3.137H29.977c-7.176 0-13.46 4.313-15.426 12.521-2.268 9.405-2.368 15.275 0 25.096 1.755 7.311 5.947 12.519 13.124 12.519h8.491V67.234c0-8.151 7.051-15.34 15.426-15.34h24.665c6.866 0 12.346-5.654 12.346-12.548V15.833c0-6.693-5.646-11.72-12.346-12.837-4.244-.706-8.645-1.027-12.866-1.008zM50.037 9.557c2.55 0 4.634 2.117 4.634 4.721 0 2.593-2.083 4.69-4.634 4.69-2.56 0-4.633-2.097-4.633-4.69-.001-2.604 2.073-4.721 4.633-4.721z" transform="translate(0 10.26)"/>
    <!-- Yellow snake -->
    <path fill="url(#py-yellow)" d="M91.682 28.38v10.966c0 8.5-7.208 15.655-15.426 15.655H51.591c-6.756 0-12.346 5.783-12.346 12.549v23.515c0 6.691 5.818 10.628 12.346 12.547 7.816 2.297 15.312 2.713 24.665 0 6.216-1.801 12.346-5.423 12.346-12.547v-9.412H63.938v-3.138h37.012c7.176 0 9.852-5.005 12.348-12.519 2.578-7.735 2.467-15.174 0-25.096-1.774-7.145-5.161-12.521-12.348-12.521h-9.268zM77.809 87.927c2.561 0 4.634 2.097 4.634 4.692 0 2.602-2.074 4.719-4.634 4.719-2.55 0-4.633-2.117-4.633-4.719 0-2.595 2.083-4.692 4.633-4.692z" transform="translate(0 10.26)"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 350)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#38BDF8" letter-spacing="2" text-anchor="middle">PYTHON</text>
  </g>
  <text x="400" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="3" text-anchor="middle">PYTHON FOR BEGINNERS &amp; AUTOMATION</text>
</svg>
